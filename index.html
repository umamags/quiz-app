<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App</title>
<style>
  :root {
    --primary: #4361ee;
    --primary-dark: #2f3fb0;
    --green: #2e7d32;
    --green-bg: #e8f5e9;
    --red: #c62828;
    --red-bg: #fdecea;
    --bg: #f4f5fb;
    --card: #ffffff;
    --border: #e0e0e8;
    --text: #23252b;
    --muted: #6b6f7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 1400px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    padding: 32px;
    min-height: 420px;
    display: flex;
    flex-direction: column;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 0 0 20px; color: var(--muted); font-weight: 500; }
  .screen { flex: 1; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* Menu screen */
  .menu-list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .menu-item {
    padding: 16px 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fafbff;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .menu-item:hover { background: #eef1ff; border-color: var(--primary); }

  /* Quiz screen */
  .progress {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .question-text { font-size: 19px; font-weight: 600; margin: 4px 0 16px; }
  .central-image-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .central-image {
    flex: 0 1 340px;
    max-width: 340px;
    max-height: 220px;
    border-radius: 12px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .choices.image-choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .choice {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    transition: border-color 0.15s, background 0.15s;
  }
  .choice:hover { border-color: var(--primary); }
  .choice.selected { border-color: var(--primary); background: #eef1ff; }
  .choice input { display: none; }
  .choice.image-choice {
    flex-direction: column;
    align-items: stretch;
    padding: 8px;
  }
  .choice.image-choice img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
  }
  .choice-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--border);
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .choice.selected .choice-letter { background: var(--primary); color: #fff; }

  /* Match-the-following */
  .match-wrap {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
  }
  .match-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .match-item {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    background: #fafbff;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    user-select: none;
  }
  .match-item.match-left { cursor: grab; }
  .match-item.match-left.dragging { opacity: 0.4; }
  .match-item.match-left.matched { cursor: default; }
  .match-item.match-right {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    min-height: 160px;
  }
  .match-item img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 6px;
  }
  .match-item.match-right.drag-over { border-color: var(--primary); background: #eef1ff; }
  .match-item.match-right.incorrect { border-color: var(--red); background: var(--red-bg); }
  .match-item.matched.correct { border-color: var(--green); background: var(--green-bg); }

  .feedback {
    padding: 12px 14px;
    border-radius: 10px;
    font-weight: 600;
    margin-bottom: 14px;
    font-size: 15px;
  }
  .feedback.correct { background: var(--green-bg); color: var(--green); }
  .feedback.incorrect { background: var(--red-bg); color: var(--red); }

  .spacer { flex: 1; }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: auto;
    padding-top: 16px;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary { background: #eceef5; color: var(--text); }
  .btn-secondary:hover { background: #dfe2ee; }
  .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

  /* Results screen */
  .score-display {
    text-align: center;
    margin: 24px 0;
  }
  .score-number { font-size: 48px; font-weight: 800; color: var(--primary); }
  .score-label { font-size: 15px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<div class="app">

  <!-- MENU SCREEN -->
  <div id="screen-menu" class="screen">
    <h1>Quiz App</h1>
    <h2>Choose a quiz to begin</h2>
    <div id="menu-list" class="menu-list"></div>
    <div id="menu-error" class="hint hidden"></div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="screen hidden">
    <div class="progress" id="progress-label"></div>
    <div class="question-text" id="question-text"></div>
    <div class="central-image-wrap" id="central-image-wrap"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div id="choices" class="choices"></div>
    <div id="match-wrap" class="match-wrap hidden">
      <div id="match-left-col" class="match-col"></div>
      <div id="match-right-col" class="match-col"></div>
    </div>
    <div class="spacer"></div>
    <div class="nav-row">
      <button class="btn-secondary" id="btn-back">Back</button>
      <button class="btn-primary" id="btn-submit">Submit</button>
      <button class="btn-primary hidden" id="btn-next">Next Question</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="screen hidden">
    <h1 id="results-title">Quiz Complete</h1>
    <div class="score-display">
      <div class="score-number" id="score-number">0 / 0</div>
      <div class="score-label">questions answered correctly</div>
    </div>
    <div class="spacer"></div>
    <div class="nav-row">
      <button class="btn-secondary" id="btn-results-back">Back</button>
      <button class="btn-primary" id="btn-results-menu">Back to Menu</button>
    </div>
  </div>

</div>

<script>
(function () {
  const LETTERS = ['a', 'b', 'c', 'd'];

  const state = {
    manifest: null,
    quiz: null,
    quizFile: null,
    currentIndex: 0,
    answers: [],       // stored final answer letter per question index, or null
    selectedNow: null, // radio selection not yet submitted
    matchState: {},    // question index -> Set of correctly-matched pair indices
    matchOrder: {},    // question index -> shuffled display order of pair indices (right column)
    settings: { sound: 'on' }
  };

  const el = (id) => document.getElementById(id);
  const screens = {
    menu: el('screen-menu'),
    quiz: el('screen-quiz'),
    results: el('screen-results')
  };

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.add('hidden'));
    screens[name].classList.remove('hidden');
  }

  // ---------- SOUND ----------
  let audioCtx = null;

  function soundEnabled() {
    return String(state.settings.sound).toUpperCase() === 'ON';
  }

  function getAudioContext() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }

  // Chrome creates a new AudioContext suspended, and its currentTime stays
  // frozen at 0 until resume() actually completes. Scheduling tones before
  // that finishes is the classic "first click makes no sound" bug, so we
  // await it here before reading currentTime.
  async function ensureAudioRunning() {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') {
      try { await ctx.resume(); } catch (e) { /* ignore */ }
    }
    return ctx;
  }

  function playTone(ctx, freq, startTime, duration, type, gainPeak) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  async function playHappySound() {
    const ctx = await ensureAudioRunning();
    const now = ctx.currentTime;
    playTone(ctx, 523.25, now, 0.12, 'triangle', 0.2);        // C5
    playTone(ctx, 659.25, now + 0.1, 0.12, 'triangle', 0.2);  // E5
    playTone(ctx, 783.99, now + 0.2, 0.22, 'triangle', 0.22); // G5
  }

  async function playUhOhSound() {
    const ctx = await ensureAudioRunning();
    const now = ctx.currentTime;
    playTone(ctx, 311.13, now, 0.18, 'sawtooth', 0.18);        // Eb4
    playTone(ctx, 233.08, now + 0.16, 0.28, 'sawtooth', 0.18); // Bb3
  }

  // ---------- SETTINGS ----------
  function loadSettings() {
    return fetch('config/settings.json')
      .then(r => r.ok ? r.json() : { sound: 'on' })
      .then(data => { state.settings = data; })
      .catch(() => { state.settings = { sound: 'on' }; });
  }

  // ---------- MENU ----------
  function loadManifest() {
    fetch('quizzes/manifest.json')
      .then(r => {
        if (!r.ok) throw new Error('manifest not found');
        return r.json();
      })
      .then(data => {
        state.manifest = data;
        renderMenu();
      })
      .catch(err => {
        const errEl = el('menu-error');
        errEl.classList.remove('hidden');
        errEl.textContent = 'Could not load quizzes/manifest.json. If you opened this file directly by double-clicking it, browsers block loading local JSON files for security reasons. Please run a simple local server instead (see README.md) and open the app via http://localhost.';
      });
  }

  function renderMenu() {
    const list = el('menu-list');
    list.innerHTML = '';
    state.manifest.quizzes.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'menu-item';
      btn.textContent = q.title;
      btn.addEventListener('click', () => startQuiz(q.file));
      list.appendChild(btn);
    });
  }

  // ---------- QUIZ ----------
  function startQuiz(file) {
    fetch(file)
      .then(r => r.json())
      .then(data => {
        state.quiz = data;
        state.quizFile = file;
        state.answers = new Array(data.questions.length).fill(null);
        state.matchState = {};
        state.matchOrder = {};
        state.currentIndex = 0;
        showScreen('quiz');
        renderQuestion();
      })
      .catch(() => {
        alert('Could not load quiz file: ' + file);
      });
  }

  function showCorrectAnswerEnabled() {
    return String(state.quiz.showCorrectAnswer).toUpperCase() === 'Y';
  }

  function renderCentralImages(q) {
    const wrap = el('central-image-wrap');
    wrap.innerHTML = '';
    if (!q.centralImage) return;
    const images = Array.isArray(q.centralImage) ? q.centralImage : [q.centralImage];
    images.forEach(src => {
      const img = document.createElement('img');
      img.className = 'central-image';
      img.src = src;
      img.alt = q.questionText;
      wrap.appendChild(img);
    });
  }

  function renderQuestion() {
    const q = state.quiz.questions[state.currentIndex];
    const total = state.quiz.questions.length;
    const storedAnswer = state.answers[state.currentIndex];
    const isMatch = q.choiceType === 'match';

    state.selectedNow = storedAnswer;

    el('progress-label').textContent = 'Question ' + (state.currentIndex + 1) + ' of ' + total;
    el('question-text').textContent = q.questionText;
    renderCentralImages(q);

    el('choices').classList.toggle('hidden', isMatch);
    el('match-wrap').classList.toggle('hidden', !isMatch);

    if (isMatch) {
      const feedbackEl = el('feedback');
      feedbackEl.classList.add('hidden');
      feedbackEl.textContent = '';

      const nextBtn = el('btn-next');
      const isLast = state.currentIndex === total - 1;
      nextBtn.textContent = isLast ? 'See Results' : 'Next Question';
      el('btn-submit').classList.add('hidden');

      renderMatchQuestion(q);

      const matchedSet = state.matchState[state.currentIndex];
      const complete = !!matchedSet && matchedSet.size === q.pairs.length;
      nextBtn.classList.toggle('hidden', !complete);
      el('btn-back').disabled = false;
      return;
    }

    // Choices
    const choicesEl = el('choices');
    choicesEl.innerHTML = '';
    const isImageChoice = q.choiceType === 'image';
    choicesEl.className = 'choices' + (isImageChoice ? ' image-choices' : '');

    q.choices.forEach((choice, i) => {
      const letter = LETTERS[i];
      const wrap = document.createElement('div');
      wrap.className = 'choice' + (isImageChoice ? ' image-choice' : '') + (storedAnswer === letter ? ' selected' : '');
      wrap.dataset.letter = letter;

      if (isImageChoice) {
        const img = document.createElement('img');
        img.src = choice;
        img.alt = 'choice ' + letter;
        wrap.appendChild(img);
        const label = document.createElement('div');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.gap = '8px';
        label.style.marginTop = '6px';
        const badge = document.createElement('span');
        badge.className = 'choice-letter';
        badge.textContent = letter.toUpperCase();
        label.appendChild(badge);
        wrap.appendChild(label);
      } else {
        const badge = document.createElement('span');
        badge.className = 'choice-letter';
        badge.textContent = letter.toUpperCase();
        wrap.appendChild(badge);
        const text = document.createElement('span');
        text.textContent = choice;
        wrap.appendChild(text);
      }

      wrap.addEventListener('click', () => selectChoice(letter));
      choicesEl.appendChild(wrap);
    });

    // Feedback + button state depends on whether this question already has a
    // resolved stored answer.
    const feedbackEl = el('feedback');
    feedbackEl.classList.add('hidden');
    feedbackEl.textContent = '';

    const submitBtn = el('btn-submit');
    const nextBtn = el('btn-next');

    const isLast = state.currentIndex === total - 1;
    nextBtn.textContent = isLast ? 'See Results' : 'Next Question';

    if (storedAnswer !== null && showCorrectAnswerEnabled() && storedAnswer === q.correctAnswer) {
      // Already correctly answered (e.g. user navigated back to review it).
      feedbackEl.classList.remove('hidden');
      feedbackEl.classList.remove('incorrect');
      feedbackEl.classList.add('correct');
      feedbackEl.textContent = 'Great job!';
      submitBtn.classList.add('hidden');
      nextBtn.classList.remove('hidden');
    } else {
      submitBtn.classList.remove('hidden');
      nextBtn.classList.add('hidden');
    }

    el('btn-back').disabled = false;
  }

  // ---------- MATCH THE FOLLOWING ----------
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderMatchItem(type, content, className) {
    const item = document.createElement('div');
    item.className = className;
    if (type === 'image') {
      const img = document.createElement('img');
      img.src = content;
      img.alt = '';
      item.appendChild(img);
    } else {
      const span = document.createElement('span');
      span.textContent = content;
      item.appendChild(span);
    }
    return item;
  }

  let draggedPairIndex = null;

  function onLeftDragStart(e) {
    draggedPairIndex = Number(e.currentTarget.dataset.pairIndex);
    e.dataTransfer.setData('text/plain', String(draggedPairIndex));
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.classList.add('dragging');
  }

  function onLeftDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    draggedPairIndex = null;
  }

  function onRightDragOver(e) {
    if (e.currentTarget.classList.contains('matched')) return;
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  }

  function onRightDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }

  function onRightDrop(e) {
    const rightEl = e.currentTarget;
    if (rightEl.classList.contains('matched')) return;
    e.preventDefault();
    rightEl.classList.remove('drag-over');
    const targetPairIndex = Number(rightEl.dataset.pairIndex);
    const sourcePairIndex = draggedPairIndex !== null
      ? draggedPairIndex
      : Number(e.dataTransfer.getData('text/plain'));

    if (sourcePairIndex === targetPairIndex) {
      handleCorrectMatch(sourcePairIndex);
    } else {
      rightEl.classList.add('incorrect');
      setTimeout(() => rightEl.classList.remove('incorrect'), 500);
    }
  }

  function handleCorrectMatch(pairIndex) {
    const idx = state.currentIndex;
    const q = state.quiz.questions[idx];
    state.matchState[idx].add(pairIndex);

    const leftEl = document.querySelector('#match-left-col .match-item[data-pair-index="' + pairIndex + '"]');
    const rightEl = document.querySelector('#match-right-col .match-item[data-pair-index="' + pairIndex + '"]');
    if (leftEl) { leftEl.classList.add('matched', 'correct'); leftEl.draggable = false; }
    if (rightEl) { rightEl.classList.add('matched', 'correct'); }

    const complete = state.matchState[idx].size === q.pairs.length;
    if (!complete) return;

    state.answers[idx] = 'matched';
    if (soundEnabled()) playHappySound();

    if (showCorrectAnswerEnabled()) {
      el('btn-next').classList.remove('hidden');
    } else {
      setTimeout(goNext, 500);
    }
  }

  function renderMatchQuestion(q) {
    const idx = state.currentIndex;
    if (!state.matchOrder[idx]) {
      state.matchOrder[idx] = shuffled(q.pairs.map((_, i) => i));
    }
    if (!state.matchState[idx]) {
      state.matchState[idx] = new Set();
    }
    const matchedSet = state.matchState[idx];
    const rightOrder = state.matchOrder[idx];

    const leftCol = el('match-left-col');
    const rightCol = el('match-right-col');
    leftCol.innerHTML = '';
    rightCol.innerHTML = '';

    q.pairs.forEach((pair, pairIndex) => {
      const isMatched = matchedSet.has(pairIndex);
      const className = 'match-item match-left' + (isMatched ? ' matched correct' : '');
      const leftEl = renderMatchItem(q.leftType, pair.left, className);
      leftEl.dataset.pairIndex = String(pairIndex);
      leftEl.draggable = !isMatched;
      if (!isMatched) {
        leftEl.addEventListener('dragstart', onLeftDragStart);
        leftEl.addEventListener('dragend', onLeftDragEnd);
      }
      leftCol.appendChild(leftEl);
    });

    rightOrder.forEach(pairIndex => {
      const pair = q.pairs[pairIndex];
      const isMatched = matchedSet.has(pairIndex);
      const className = 'match-item match-right' + (isMatched ? ' matched correct' : '');
      const rightEl = renderMatchItem(q.rightType, pair.right, className);
      rightEl.dataset.pairIndex = String(pairIndex);
      if (!isMatched) {
        rightEl.addEventListener('dragover', onRightDragOver);
        rightEl.addEventListener('dragleave', onRightDragLeave);
        rightEl.addEventListener('drop', onRightDrop);
      }
      rightCol.appendChild(rightEl);
    });
  }

  function selectChoice(letter) {
    state.selectedNow = letter;
    document.querySelectorAll('#choices .choice').forEach(c => {
      c.classList.toggle('selected', c.dataset.letter === letter);
    });
  }

  function submitAnswer() {
    if (!state.selectedNow) {
      const feedbackEl = el('feedback');
      feedbackEl.classList.remove('hidden', 'correct');
      feedbackEl.classList.add('incorrect');
      feedbackEl.textContent = 'Please select an answer first.';
      return;
    }

    const q = state.quiz.questions[state.currentIndex];
    state.answers[state.currentIndex] = state.selectedNow;
    const isCorrect = state.selectedNow === q.correctAnswer;

    if (soundEnabled()) {
      if (isCorrect) playHappySound(); else playUhOhSound();
    }

    if (!showCorrectAnswerEnabled()) {
      // Silent scoring: no message, move straight on.
      goNext();
      return;
    }

    const feedbackEl = el('feedback');
    feedbackEl.classList.remove('hidden');
    if (isCorrect) {
      feedbackEl.classList.remove('incorrect');
      feedbackEl.classList.add('correct');
      feedbackEl.textContent = 'Great job!';
      el('btn-submit').classList.add('hidden');
      el('btn-next').classList.remove('hidden');
    } else {
      feedbackEl.classList.remove('correct');
      feedbackEl.classList.add('incorrect');
      feedbackEl.textContent = 'Incorrect. Please choose again.';
    }
  }

  function goNext() {
    const total = state.quiz.questions.length;
    if (state.currentIndex < total - 1) {
      state.currentIndex += 1;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function goBack() {
    if (state.currentIndex > 0) {
      state.currentIndex -= 1;
      renderQuestion();
    } else {
      showScreen('menu');
    }
  }

  // ---------- RESULTS ----------
  function computeScore() {
    let score = 0;
    state.quiz.questions.forEach((q, i) => {
      if (q.choiceType === 'match') {
        const matchedSet = state.matchState[i];
        if (matchedSet && matchedSet.size === q.pairs.length) score += 1;
      } else if (state.answers[i] === q.correctAnswer) {
        score += 1;
      }
    });
    return { score, total: state.quiz.questions.length };
  }

  function showResults() {
    const { score, total } = computeScore();
    el('results-title').textContent = state.quiz.quizTitle + ' - Complete';
    el('score-number').textContent = score + ' / ' + total;
    showScreen('results');
  }

  function resultsBack() {
    state.currentIndex = state.quiz.questions.length - 1;
    showScreen('quiz');
    renderQuestion();
  }

  // ---------- WIRE UP ----------
  el('btn-submit').addEventListener('click', submitAnswer);
  el('btn-next').addEventListener('click', goNext);
  el('btn-back').addEventListener('click', goBack);
  el('btn-results-menu').addEventListener('click', () => showScreen('menu'));
  el('btn-results-back').addEventListener('click', resultsBack);

  loadSettings().then(loadManifest);
})();
</script>

</body>
</html>
